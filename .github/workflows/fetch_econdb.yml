name: EconDB Data Collection

# 스케줄:
#   매 시간 :05  → per-port 3개 endpoint 수집 (100개씩, 하루 2,400개)
#   매일 02:00   → Top 20 스냅샷 (congestion + volume)
#   매주 월 03:00 → 지역별 locode 갱신 + 90일 정리

on:
  schedule:
    - cron: '5 * * * *'     # 매 시간 05분 — ports
    - cron: '0 2 * * *'     # 매일 02:00  — snapshots
    - cron: '0 3 * * 1'     # 매주 월 03:00 — regions + cleanup
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        default: 'ports'
        type: choice
        options: [regions, ports, snapshots, cleanup]

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install httpx supabase

      - name: Determine job type
        id: job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.job }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%-H)
            DOW=$(date -u +%u)
            MINUTE=$(date -u +%-M)
            if [ "$HOUR" = "3" ] && [ "$DOW" = "1" ]; then
              echo "type=regions" >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "2" ] && [ "$MINUTE" -lt "15" ]; then
              echo "type=snapshots" >> $GITHUB_OUTPUT
            else
              echo "type=ports" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run collection job
        run: python scripts/fetch_econdb.py --job ${{ steps.job.outputs.type }}
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}

      # regions 후 cleanup도 함께 실행 (주 1회)
      - name: Cleanup old timeseries (weekly, after regions)
        if: steps.job.outputs.type == 'regions'
        run: python scripts/fetch_econdb.py --job cleanup
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
