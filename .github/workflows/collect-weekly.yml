name: Collect — Weekly (EconDB Locode Discovery + Cleanup)

# 매주 월요일 UTC 03:00 (KST 12:00)
# 1. EconDB 18지역 × congestion_region_ports → econdb_ports 갱신 (~750개 locode)
# 2. econdb_port_timeseries 90일 이전 데이터 삭제

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  regions-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Locode 목록 갱신
        run: python scripts/fetch_econdb.py --job regions
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: 오래된 timeseries 정리
        run: python scripts/fetch_econdb.py --job cleanup
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
