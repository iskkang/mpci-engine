name: Deploy Frontend

# frontend/ 변경 시 GitHub Pages 자동 배포
# 수동 실행도 가능

on:
  push:
    branches: [main]
    paths: [frontend/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend }
      - id: deploy
        uses: actions/deploy-pages@v4
