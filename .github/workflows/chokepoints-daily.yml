name: Chokepoints Daily Fetch

# EconDB 6해협 + ShipFinder Hormuz — 일 1회
# UTC 03:00 = KST 12:00 (econdb-regions-daily UTC 02:00 이후)
# 두 스텝 독립 실행: 한쪽 실패가 다른 쪽을 막지 않음

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  fetch-econdb-chokepoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_econdb_chokepoints.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  fetch-shipfinder-hormuz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_shipfinder_hormuz.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # SHIPFINDER_BASE_URL: https://www.shipfinder.co  # 필요시 재정의
